# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# One block per (ecosystem, directory) - a duplicate pair makes Dependabot
# reject the whole file and open nothing at all.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
